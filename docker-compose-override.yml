services:
  dev-main:
    volumes:
      # Repository root, for .github/ templates and the sources of the mounts below. Nothing is
      # mounted into /nso/run/packages, so it keeps only the service packages (mounting into it
      # leaves empty placeholders in the repo).
      - type: bind
        source: .
        target: /workspace
      # Hide the repository's git data: commit and push from the host
      - type: tmpfs
        target: /workspace/.git
      # Ruff rules as the user-level config, for files outside /workspace (/nso/run/packages)
      - type: bind
        source: ./ruff.toml
        target: /root/.config/ruff/ruff.toml
        read_only: true
      # Claude Code login and history survive container rebuilds
      - type: volume
        source: claude-config
        target: /root/.claude
      # Claude Code starts in /nso/run/packages. It reads CLAUDE.md from parent folders, but
      # .claude/ only from the start folder, so the project config is mounted at user level.
      - type: bind
        source: ./CLAUDE.md
        target: /nso/run/CLAUDE.md
        read_only: true
      - type: bind
        source: ./.claude/settings.json
        target: /root/.claude/settings.json
        read_only: true
      - type: bind
        source: ./.claude/hooks
        target: /root/.claude/hooks
        read_only: true
      - type: bind
        source: ./.claude/skills
        target: /root/.claude/skills
        read_only: true
      - type: bind
        source: ./.claude/agents
        target: /root/.claude/agents
        read_only: true
      - type: bind
        source: ./Makefile
        target: /workspace-tools/Makefile
        read_only: true
      - type: bind
        source: ./scripts
        target: /workspace-tools/scripts
        read_only: true
      # Cisco Secure Access TLS-inspection CA, exported from the macOS keychain
      - type: bind
        source: ./certs/cisco-ca.pem
        target: /usr/local/share/ca-certificates/cisco-secure-access.crt
        read_only: true
    environment:
      # Read by .mcp.json to authenticate the GitHub MCP server
      - GITHUB_PAT=${GITHUB_PAT:-}
      # Target repository (owner/repo) for the github MCP server, used by CLAUDE.md and skills
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-}
      # Trust the Cisco Secure Access CA in Claude Code (Node)
      - NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/cisco-secure-access.crt
      # Where .claude/settings.json finds the hooks inside the container
      - CLAUDE_HOOKS_DIR=/root/.claude/hooks
      # Keep ruff's cache out of the packages folder
      - RUFF_CACHE_DIR=/tmp/ruff-cache

volumes:
  claude-config:
